'use strict';
const STORAGE='kfupm-mall-hub-prototype-v1';

 const offers=[{id:'f1',vendorId:'v1',title:'Sandwich and drink offer',description:'Ask for the sandwich and drink promotion when collecting. Promotional item prices are managed separately.',start:dt(-1),end:dt(7),removed:false},{id:'f2',vendorId:'v2',title:'Coffee morning',description:'Upcoming coffee promotion. Ask the vendor for details.',start:dt(2,'08:00'),end:dt(5,'12:00'),removed:false},{id:'f3',vendorId:'v4',title:'Last week laundry offer',description:'Expired sample offer.',start:dt(-10),end:dt(-3),removed:false}];
 const events=[{id:'e1',owner:'u2',club:'Computing Club',title:'Web development meetup',description:'A casual student meetup on building useful campus applications.',location:'Mall seating area',start:dt(3,'18:00'),end:dt(3,'19:30'),status:'Approved',reason:'',created:stamp()},{id:'e2',owner:'u2',club:'Computing Club',title:'Project showcase',description:'Share your semester project with students and faculty.',location:'Central mall area',start:dt(5,'18:00'),end:dt(5,'20:00'),status:'Pending review',reason:'',created:stamp()},{id:'e3',owner:'u2',club:'Computing Club',title:'Late night workshop',description:'A sample rejected submission.',location:'Mall seating area',start:dt(7,'23:00'),end:dt(8,'01:00'),status:'Rejected',reason:'Please choose a time within mall opening hours.',created:stamp()}];

}
let db,storageOK=true;try{const raw=localStorage.getItem(STORAGE);db=raw?JSON.parse(raw):seed();if(db.version!==1)db=seed()}catch(e){storageOK=false;db=seed()}
let session=null,route='feed',params={},notes=true,authTab='login',contentTab='announcements',cart={},booking={},filters={feed:'All',directory:'',category:'All',requestType:'All',requestStatus:'All',vendorSearch:'',eventStatus:'All',offerState:'All',offerVendor:'All'},modalCallback=null,focusBeforeModal=null;

function activity(text){db.activity.unshift({at:stamp(),text});db.activity=db.activity.slice(0,100);persist()}
const user=()=>db.users.find(u=>u.id===session),vendor=id=>db.vendors.find(v=>v.id===id),ownVendor=()=>vendor(user()?.vendorId),offering=id=>db.offerings.find(o=>o.id===id),isTerminal=s=>['Completed','Rejected','Cancelled'].includes(s),activeVendor=id=>vendor(id)?.status==='Active';

function badge(s){return `<span class="badge ${['Open','Active','Approved','Completed','Published'].includes(s)?'dark':''}">${esc(s)}</span>`}
function btn(label,action,data={},kind=''){return `<button type="button" class="${kind}" data-action="${action}" ${Object.entries(data).map(([k,v])=>`data-${k}="${esc(v)}"`).join(' ')}>${esc(label)}</button>`}
function link(label,to,extra={},kind=''){return btn(label,'navigate',{route:to,...extra},kind)}
function empty(title,message,action=''){return `<div class="empty"><h3>${esc(title)}</h3><p class="muted">${esc(message)}</p>${action}</div>`}
function metric(label,value,desc='',to=''){return `<div class="metric"><span class="muted tiny">${esc(label)}</span><strong>${esc(value)}</strong><span class="tiny">${esc(desc)}</span>${to?'<div style="margin-top:9px">'+link('View →',to,{},'small')+'</div>':''}</div>`}
function table(headers,rows){return `<div class="tablewrap"><table><thead><tr>${headers.map(h=>'<th>'+esc(h)+'</th>').join('')}</tr></thead><tbody>${rows.length?rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join(''):'<tr><td colspan="'+headers.length+'" class="muted">No matching records.</td></tr>'}</tbody></table></div>`}
function field(name,label,value='',type='text',opts={}){const attr=`name="${esc(name)}" id="field-${esc(name)}" ${opts.readonly?'readonly':''} ${opts.min!==undefined?'min="'+esc(opts.min)+'"':''} ${opts.step?'step="'+esc(opts.step)+'"':''}`;let input;if(type==='textarea')input=`<textarea ${attr}>${esc(value)}</textarea>`;else if(type==='select')input=`<select ${attr}>${(opts.options||[]).map(x=>{const val=typeof x==='object'?x.value:x,lab=typeof x==='object'?x.label:x;return `<option value="${esc(val)}" ${String(value)===String(val)?'selected':''}>${esc(lab)}</option>`}).join('')}</select>`;else input=`<input ${attr} type="${type}" value="${esc(value)}" ${opts.placeholder?'placeholder="'+esc(opts.placeholder)+'"':''} ${type==='password'?'autocomplete="off"':''}>`;return `<label class="${opts.full?'full':''}" for="field-${esc(name)}">${esc(label)}${input}${opts.help?'<small>'+esc(opts.help)+'</small>':''}</label>`}
function errorForm(form,errors){form.querySelectorAll('.field-error').forEach(x=>x.remove());form.querySelectorAll('.field-invalid').forEach(x=>x.classList.remove('field-invalid'));const box=form.querySelector('.errorbox');box.innerHTML='<strong>Please check the following:</strong> '+Object.values(errors).map(esc).join(' ');box.tabIndex=-1;for(const [name,msg] of Object.entries(errors)){const el=form.elements.namedItem(name);if(el&&el.tagName){el.classList.add('field-invalid');const span=document.createElement('span');span.className='field-error';span.textContent=msg;el.after(span)}}box.focus()}
function formStart(action,extra=''){return `<form data-form="${action}" novalidate ${extra}><div class="errorbox" role="alert"></div>`}
function formEnd(label='Save',cancel=true){return `<div class="actions">${cancel?btn('Cancel','close-modal'):''}<button type="submit" class="primary">${esc(label)}</button></div></form>`}
function openModal(title,html,large=false){focusBeforeModal=document.activeElement;$('#modalroot').innerHTML=`<div class="modalback"><section class="modal ${large?'large':''}" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modalhead"><h2 id="modal-title">${esc(title)}</h2>${btn('×','close-modal',{},'quiet')}</div>${html}</section></div>`;setTimeout(()=>$('#modalroot').querySelector('input:not([readonly]),select,textarea,button')?.focus(),0)}
function closeModal(){ $('#modalroot').innerHTML='';modalCallback=null;focusBeforeModal?.focus() }
function confirmAction(title,message,callback,reason=false,extra=''){modalCallback=callback;openModal(title,`<p>${esc(message)}</p>${extra}${formStart('confirm')}${reason?field('reason','Reason','','textarea'):''}${formEnd('Confirm')}`)}
function success(title,message,to,data={}){openModal(title,`<div class="confirmicon">✓</div><p>${esc(message)}</p><div class="actions">${btn('Close','close-modal')}${link('View details',to,data,'primary')}</div>`)}

function allowed(){const role=user()?.role;if(['feed','directory','vendor','login'].includes(route))return true;if(!role)return false;if(route==='profile')return true;if(['restaurant','barber','laundry','myrequests','club'].includes(route))return role==='visitor';if(route==='request'){const r=db.requests.find(x=>x.id===params.id);return !!r&&(role==='visitor'?r.owner===session:role==='vendor'?r.vendorId===user().vendorId:false)}if(['vdash','business','offerings','vrequests','offers'].includes(route))return role==='vendor';return role==='admin'}
function render(){if(user()?.role==='vendor'&&ownVendor()?.status!=='Active'){session=null;route='login';toast('Vendor access is unavailable until the account is Active.')}const u=user(),role=u?.role||'guest';const demos=db.users.filter(x=>x.role==='visitor'||x.role==='admin'||x.role==='vendor').map(x=>`<option value="${x.id}" ${session===x.id?'selected':''}>${esc(x.role==='vendor'?vendor(x.vendorId).name+' · '+vendor(x.vendorId).status:x.name+(x.club?' · Club representative':' · '+x.role))}</option>`).join('');
 $('#app').innerHTML=`<div class="demo"><strong>DEMO CONTROLS</strong><span>Simulated accounts</span><select id="demo-account" aria-label="Choose demo account"><option value="" ${!session?'selected':''}>Public visitor · Signed out</option>${demos}</select><span class="spacer"></span><span class="tag">${storageOK?'Changes saved in this browser':'Temporary data · refresh resets'}</span>${btn(notes?'Hide annotations':'Show annotations','notes',{},'small')}${btn('Screen index','index',{},'small')}${btn('Reset demo','reset',{},'small')}</div><header class="topbar"><div class="brand"><div class="brandmark">M</div><div><strong>KFUPM Mall Hub</strong><small>Discover · Connect · Request</small></div></div><div class="identity">${u?`<div class="avatar">${esc(u.name[0])}</div><span>${esc(u.name)}<small>${esc(u.club?'Visitor · '+u.club+' representative':role==='vendor'?vendor(u.vendorId).name:role==='admin'?'Mall administrator':'Mall visitor')}</small></span>${btn('Sign out','logout',{},'small')}`:link('Login / Sign up','login',{},'small')}</div></header><div class="layout"><nav class="sidebar" aria-label="Main navigation"><p class="navlabel">${role==='guest'?'Discover the mall':role==='admin'?'Administration':role==='vendor'?'Business workspace':'Visitor workspace'}</p>${paths[role].filter(([r])=>r!=='club'||u?.club||db.events.some(e=>e.owner===session)).map(([r,l])=>btn(l,'navigate',{route:r},'navbtn '+(route===r?'active':''))).join('')}<hr><div class="foot">Medium fidelity prototype<br>Team 8 · SWE 363<br>All names and records are fictional demo data.</div></nav><main class="workspace"><div class="contentwrap ${notes?'':'no-notes'}"><div id="page">${allowed()?page():empty('Access restricted','Choose an authorized demo account or sign in to continue.',link('Go to login','login',{},'primary'))}</div>${notes?annotation():''}</div></main></div>`;

function head(title,subtitle,action=''){return `<div class="screenid">${maps[route][0]} / ${esc(maps[route][1])}</div><div class="pagehead"><div><div class="eyebrow">${user()?.role==='admin'?'Administration':user()?.role==='vendor'?'Business workspace':'KFUPM Mall Hub'}</div><h1>${esc(title)}</h1><p class="subtitle">${esc(subtitle)}</p></div>${action?'<div class="actions">'+action+'</div>':''}</div>`}
function offerState(f){if(f.removed)return 'Removed';if(ms(f.start)>now())return 'Scheduled';return ms(f.end)>now()?'Active':'Expired'}
function publicationState(x){return x.removed?'Removed':ms(x.publication)>now()?'Scheduled':'Published'}

function feedItems(){return [...db.announcements.filter(x=>publicationState(x)==='Published').map(x=>({...x,kind:'Announcements',text:x.message,date:x.publication})),...db.matches.filter(x=>publicationState(x)==='Published').map(x=>({...x,kind:'Matches',title:x.team1+' vs '+x.team2,text:'Showing at '+x.location,date:x.start})),...db.events.filter(x=>x.status==='Approved').map(x=>({...x,kind:'Club events',text:x.description,date:x.start})),...db.offers.filter(x=>offerState(x)==='Active'&&activeVendor(x.vendorId)).map(x=>({...x,kind:'Offers',text:x.description,date:x.start}))].sort((a,b)=>ms(b.date)-ms(a.date))}
function feedPage(){const items=feedItems().filter(x=>filters.feed==='All'||x.kind===filters.feed);return head('What’s happening at the mall','Discover announcements, club activities, vendor offers, and upcoming screenings.')+`<div class="chips">${['All','Announcements','Club events','Offers','Matches'].map(x=>btn(x,'feed-filter',{value:x},'chip '+(filters.feed===x?'selected':''))).join('')}</div>${items.length?'<div class="grid">'+items.map(x=>`<article class="card"><div class="row between"><span class="badge">${esc(x.kind)}</span><span class="tiny muted">${esc(x.club||vendor(x.vendorId)?.name||'Mall management')}</span></div><h2 style="margin-top:15px">${esc(x.title)}</h2><p class="muted">${esc(x.text)}</p><div class="cardfooter"><span class="tiny muted">${fmt(x.date)}</span>${btn('View details','content-detail',{id:x.id,kind:x.kind},'small')}</div></article>`).join('')+'</div>':empty('No content to show','There are no published items for this filter.',btn('Show all','feed-filter',{value:'All'}))}`}
function directoryPage(){const list=db.vendors.filter(v=>v.status==='Active'&&v.name.toLowerCase().includes(filters.directory.toLowerCase())&&(filters.category==='All'||v.category===filters.category));return head('Vendor directory','Find a business and explore its offerings and available services.')+`<div class="filters"><label>Search businesses<input id="directory-search" placeholder="Search by business name…" value="${esc(filters.directory)}"></label><label style="max-width:210px">Category<select id="directory-category">${['All',...db.categories].map(c=>`<option ${c===filters.category?'selected':''}>${esc(c)}</option>`).join('')}</select></label>${btn('Clear','clear-directory',{},'small')}</div><p class="tiny muted">${list.length} business${list.length===1?'':'es'} found</p>${list.length?'<div class="grid">'+list.map(v=>`<article class="card"><div class="placeholder">BUSINESS IMAGE</div><div class="row between"><h2 style="margin:0">${esc(v.name)}</h2>${badge(v.operating)}</div><p class="tiny muted">${esc(v.category)}</p><p>${esc(v.description)}</p><div class="cardfooter"><span class="tiny muted">${esc(v.location)}</span>${link('View business','vendor',{id:v.id},'small')}</div></article>`).join('')+'</div>':empty('No businesses found','Try a different name or category.',btn('Clear filters','clear-directory'))}`}
function vendorPage(){const v=vendor(params.id);if(!v||v.status!=='Active')return head('Business unavailable','This business is not currently accepting new activity.')+empty('Business unavailable','Browse another active business.',link('Back to directory','directory'));const list=db.offerings.filter(o=>o.vendorId===v.id&&!o.removed),offers=db.offers.filter(f=>f.vendorId===v.id&&offerState(f)==='Active');const action={restaurant:['Start pickup order','restaurant'],barber:['Book appointment','barber'],laundry:['Request laundry pickup','laundry']}[v.type];return head(v.name,v.category,link('← Directory','directory',{},'small'))+`<div class="panel"><div class="vendorhero"><div class="placeholder">IMAGE</div><div><div class="row">${badge(v.operating)}<span class="tiny muted">${esc(v.location)}</span></div><p style="margin-top:10px">${esc(v.description)}</p>${action?link(action[0],action[1],{id:v.id},'primary'):'<span class="tiny muted">Browse offerings · Purchasing takes place in store</span>'}</div></div></div><div class="grid"><section class="panel"><h2>Business information</h2><dl class="info"><dt>Location</dt><dd>${esc(v.location)}</dd><dt>Contact</dt><dd>${esc(v.contact)}${v.phone?'<br>'+esc(v.phone):''}</dd><dt>Hours</dt><dd>${v.hours.map(x=>esc(x.day)+': '+(x.closed?'Closed':esc(x.open)+'–'+esc(x.close))).join('<br>')}</dd></dl><p class="tiny muted">Open/Closed is set by the vendor; weekly hours are shown for planning.</p></section><section class="panel"><h2>${v.type==='restaurant'?'Menu':'Offerings'}</h2>${list.length?list.map(o=>`<div class="listitem"><div><strong>${esc(o.name)}</strong><div class="tiny muted">${esc(o.description)}</div></div><div class="stack">${o.price==null?'Quote offline':money(o.price)}${!o.available?badge('Unavailable'):''}</div></div>`).join(''):empty('No offerings yet','This vendor has not listed offerings.')}</section></div><section class="panel"><h2>Current offers</h2>${offers.length?offers.map(f=>`<div class="listitem"><div><strong>${esc(f.title)}</strong><p class="tiny muted" style="margin:4px 0">${esc(f.description)}</p><span class="tiny">Until ${fmt(f.end)}</span></div></div>`).join(''):'<p class="muted">No active offers.</p>'}</section>`}

function availableSlots(v,date,ignore=''){const dow=new Date(date+'T12:00:00+03:00').getUTCDay(),schedule=v.hours[dow];if(!schedule||schedule.closed)return [];const start=Number(schedule.open.slice(0,2))*60+Number(schedule.open.slice(3)),end=Number(schedule.close.slice(0,2))*60+Number(schedule.close.slice(3));const slots=[];for(let min=start;min+30<=end;min+=30){const time=String(Math.floor(min/60)).padStart(2,'0')+':'+String(min%60).padStart(2,'0'),slot=date+'T'+time;slots.push({slot,time,blocked:ms(slot)<=now()||db.requests.some(r=>r.id!==ignore&&r.type==='barber'&&r.vendorId===v.id&&r.slot===slot&&['Pending','Accepted'].includes(r.status))})}return slots}
function barberPage(){const guard=serviceGuard();if(guard)return guard;const v=vendor(params.id),r=db.requests.find(x=>x.id===booking.requestId),list=db.offerings.filter(o=>o.vendorId===v.id&&o.available&&!o.removed);if(!booking.date)booking.date=riyadhDate(1);if(!booking.serviceId)booking.serviceId=r?.serviceId||list[0]?.id||'';const slots=availableSlots(v,booking.date,booking.requestId),o=offering(booking.serviceId);return head(r?'Reschedule appointment':'Book a barber appointment',v.name+' · One 30-minute appointment per slot. Payment at the barbershop.',link('← Business','vendor',{id:v.id},'small'))+`<section class="panel"><div class="formgrid"><label>Service<select id="barber-service">${list.map(x=>`<option value="${x.id}" ${booking.serviceId===x.id?'selected':''}>${esc(x.name)} · ${money(x.price)}</option>`).join('')}</select></label><label>Date<input id="barber-date" type="date" value="${booking.date}" min="${riyadhDate()}"></label></div><h3>Choose an available slot</h3><p class="tiny muted">Times are in Asia/Riyadh. Crossed-out slots are past or reserved.</p><div class="slots">${slots.map(s=>`<button class="slot ${booking.slot===s.slot?'selected':''}" data-action="choose-slot" data-slot="${s.slot}" ${s.blocked?'disabled':''}>${s.time}</button>`).join('')}</div>${!slots.length?'<div class="notice">No slots are available for this day. Choose another date.</div>':''}<div class="notice">${r?'A successful reschedule releases your old slot and requires vendor acceptance again. If the new slot is unavailable, your original booking stays unchanged.':'Your slot is reserved while the vendor reviews your booking. Acceptance is shown under My Requests.'}</div><div class="row between"><span>${o?esc(o.name)+' · '+money(o.price):'No service available'}</span>${btn(r?'Review reschedule':'Review booking','review-booking',{},'primary')}</div></section>`}

function requestRows(list,isVendor){return list.map(r=>[ `<strong>${esc(r.id)}</strong><div class="tiny muted">${r.type==='restaurant'?'Pickup order':r.type==='barber'?'Barber appointment':'Laundry pickup'}</div>`,esc(isVendor?db.users.find(u=>u.id===r.owner)?.name:vendor(r.vendorId)?.name),fmt(r.slot||r.preferred||r.created),badge(r.status),link('View details','request',{id:r.id},'small')])}
function requestList(isVendor){const owned=db.requests.filter(r=>isVendor?r.vendorId===user().vendorId:r.owner===session),list=owned.filter(r=>(filters.requestType==='All'||r.type===filters.requestType)&&(filters.requestStatus==='All'||r.status===filters.requestStatus));return head(isVendor?'Customer requests':'My Requests',isVendor?'Review requests and update progress for your assigned business.':'Track your pickup orders, appointments, and laundry requests.')+`<div class="metrics">${metric('Pending',owned.filter(r=>r.status==='Pending').length,'Awaiting vendor response')}${metric('Active',owned.filter(r=>!isTerminal(r.status)&&r.status!=='Pending').length,'Accepted or in progress')}${metric('Completed',owned.filter(r=>r.status==='Completed').length,'Finished requests')}</div><section class="panel"><div class="filters"><label>Request type<select id="request-type">${[['All','All types'],['restaurant','Restaurant'],['barber','Barber'],['laundry','Laundry']].map(([v,l])=>`<option value="${v}" ${filters.requestType===v?'selected':''}>${l}</option>`).join('')}</select></label><label>Status<select id="request-status">${['All','Pending','Preparing','Ready for pickup','Accepted','Scheduled','Collected','Cleaning','Ready','Completed','Rejected','Cancelled'].map(x=>`<option ${x===filters.requestStatus?'selected':''}>${x}</option>`).join('')}</select></label></div>${owned.length?table(['Request',isVendor?'Customer':'Business','Date / time','Status','Action'],requestRows(list,isVendor)):empty('No requests yet',isVendor?'Customer requests will appear here.':'Find a business to submit your first request.',!isVendor?link('Browse businesses','directory',{},'primary'):'')}</section>`}
function canVisitorCancel(r){return r.type==='restaurant'?r.status==='Pending':r.type==='barber'?['Pending','Accepted'].includes(r.status)&&ms(r.slot)>now():['Pending','Scheduled'].includes(r.status)}

 return head(r.id,(r.type==='restaurant'?'Restaurant pickup':r.type==='barber'?'Barber appointment':'Laundry pickup')+' · '+v.name,link('← Requests',isVendor?'vrequests':'myrequests',{},'small'))+`<div class="row" style="margin-bottom:18px">${badge(r.status)}<span class="tiny muted">Created ${fmt(r.created)}</span></div><div class="split"><section class="panel"><h2>Request details</h2><dl class="info"><dt>Business</dt><dd>${esc(v.name)}</dd><dt>Customer</dt><dd>${esc(u?.name||'Visitor')}</dd>${isVendor?'<dt>Customer email</dt><dd>'+esc(u?.email)+'</dd>':''}</dl>${details}<div class="notice">${r.type==='restaurant'?'Pickup only · Pay at the restaurant.':r.type==='barber'?'Payment at the barbershop. Completion is enabled once the appointment starts.':'The vendor confirms pickup time and final price offline.'}</div>${v.status!=='Active'?'<div class="notice">This vendor is currently '+esc(v.status)+'. Existing history remains visible; no new request can be made.</div>':''}<div class="row">${actions}</div>${!isVendor&&!canVisitorCancel(r)&&!isTerminal(r.status)?'<p class="tiny muted" style="margin-top:12px">Visitor cancellation is unavailable at this stage.</p>':''}${isTerminal(r.status)?'<p class="tiny muted">This request is closed. No further status changes are available.</p>':''}</section><section class="panel"><h2>Status history</h2><ol class="timeline">${r.history.slice().reverse().map(h=>`<li><strong>${esc(h.status)}</strong><small>${fmt(h.at)} · ${esc(h.actor)}</small>${h.reason?'<p class="tiny" style="margin:5px 0">'+esc(h.reason)+'</p>':''}</li>`).join('')}</ol></section></div>`}
