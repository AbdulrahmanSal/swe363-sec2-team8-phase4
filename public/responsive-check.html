<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Admin module responsive check</title>
    <style>
      body {
        margin: 20px;
        background: #dfe8e2;
        color: #214c33;
        font: 14px Arial;
      }
      h1 {
        font-size: 21px;
      }
      nav {
        display: flex;
        gap: 14px;
        margin: 20px 0;
      }
      a {
        color: #00573f;
      }
      main {
        display: flex;
        align-items: start;
        gap: 22px;
      }
      article {
        flex-shrink: 0;
      }
      h2 {
        font-size: 13px;
      }
      iframe {
        display: block;
        border: 1px solid #b6cdbb;
        background: white;
        height: 1050px;
      }
      p {
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h1>Responsive verification · Ibrahim's admin module</h1>
    <p>
      Each frame has a real independent viewport. This page is for local QA, not
      a coursework screen.
    </p>
    <nav id="routes"></nav>
    <main id="frames"></main>
    <script>
      const pages = [
        ["Overview", "/admin"],
        ["Vendors", "/admin/vendors"],
        ["Content", "/admin/content"],
        ["Permissions", "/admin/permissions"],
        ["Events", "/admin/events"],
        ["Offers", "/admin/offers"],
      ];
      const route =
        new URLSearchParams(location.search).get("page") || "/admin";
      for (const [name, path] of pages) {
        const a = document.createElement("a");
        a.href = "?page=" + encodeURIComponent(path);
        a.textContent = name;
        document.getElementById("routes").append(a);
      }
      for (const width of [375, 768, 1440]) {
        const article = document.createElement("article"),
          h = document.createElement("h2"),
          frame = document.createElement("iframe");
        h.textContent = width + " px viewport";
        frame.title = width + " px admin preview";
        frame.width = width;
        frame.src = "./#" + route;
        article.append(h, frame);
        document.getElementById("frames").append(article);
      }
    </script>
  </body>
</html>
